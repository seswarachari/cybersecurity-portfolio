<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 927" width="1200" height="927">
  <defs>
    <linearGradient id="isc2Green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00833E" />
      <stop offset="100%" stop-color="#005A2B" />
    </linearGradient>
    <linearGradient id="isc2Cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#0077C8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="927" fill="url(#bgGrad)" />

  <!-- Outer Geometric Border Accents (ISC2 Style) -->
  <rect x="36" y="36" width="1128" height="855" fill="none" stroke="#CBD5E1" stroke-width="2" />
  <rect x="48" y="48" width="1104" height="831" fill="none" stroke="#00833E" stroke-width="3" />

  <!-- Right Side Decorative Geometric Ribbon -->
  <polygon points="940,48 1152,48 1152,879 860,879" fill="#F1F5F9" />
  <polygon points="985,48 1152,48 1152,879 910,879" fill="#00833E" opacity="0.08" />
  <polygon points="1045,48 1152,48 1152,879 975,879" fill="url(#isc2Green)" opacity="0.92" />
  <polygon points="1100,48 1152,48 1152,879 1045,879" fill="url(#isc2Cyan)" opacity="0.85" />

  <!-- ISC2 Official Style Logo Header -->
  <g transform="translate(110, 115)">
    <rect x="0" y="0" width="148" height="64" rx="6" fill="url(#isc2Green)" />
    <text x="74" y="44" font-family="Inter, Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ISC2</text>
    <text x="168" y="28" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0F172A" letter-spacing="2">CERTIFIED IN CYBERSECURITY</text>
    <text x="168" y="50" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#475569" letter-spacing="1">OFFICIAL EDUCATION &amp; TRAINING CERTIFICATE</text>
  </g>

  <!-- Title -->
  <text x="110" y="275" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Certificate of Completion</text>
  <rect x="110" y="298" width="140" height="5" fill="#00833E" rx="2" />

  <text x="110" y="365" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#64748B">This is to certify that</text>

  <!-- Candidate Name -->
  <text x="110" y="430" font-family="Inter, Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#005A2B">Eswarachari Sharabu</text>
  <line x1="110" y1="450" x2="780" y2="450" stroke="#CBD5E1" stroke-width="1.5" />

  <text x="110" y="505" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#64748B">has successfully completed the official ISC2 training course</text>

  <!-- Course Name -->
  <text x="110" y="565" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0F172A">CC Domain 5: Security Operations</text>
  <text x="110" y="605" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0077C8" letter-spacing="0.5">Data Security · System Hardening · Security Monitoring · Incident Response</text>

  <!-- Metadata Grid -->
  <g transform="translate(110, 675)">
    <rect x="0" y="0" width="320" height="84" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="20" y="28" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1.5">DATE OF COMPLETION</text>
    <text x="20" y="58" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F172A">16 April, 2025</text>

    <rect x="345" y="0" width="465" height="84" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="365" y="28" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1.5">VERIFIED ISC2 LEARNER ID</text>
    <text x="365" y="56" font-family="monospace" font-size="15" font-weight="700" fill="#0F172A">a8f366e6-f421-4008-a7b2-f47d4c5e451b</text>
  </g>

  <!-- Official Seal Badge -->
  <g transform="translate(835, 360)">
    <circle cx="80" cy="80" r="68" fill="#FFFFFF" stroke="#00833E" stroke-width="4" />
    <circle cx="80" cy="80" r="58" fill="none" stroke="#00A3E0" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="80" y="68" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#00833E" text-anchor="middle">ISC2</text>
    <text x="80" y="90" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="80" y="108" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">DOMAIN 5</text>
  </g>

  <!-- Footer -->
  <text x="110" y="825" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#64748B">International Information System Security Certification Consortium (ISC)² · Verified Record</text>
</svg>
